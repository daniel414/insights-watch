# Forward statistics of a fixed candlestick-pattern rule set on BTCUSDT 4h/1d. Research only, nothing is sent anywhere.
# Runs ~5 min after each 4h close (UTC 00/04/08/12/16/20 = Taipei 08/12/16/20/00/04). Missed runs are caught up next run.
name: paper-track
on:
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-track
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/paper
            paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pandas==2.2.3" "numpy==2.1.3"
      - name: Update paper records
        run: python scripts/paper/paper_track.py
      - name: Commit paper/
        run: |
          git config user.name "paper-track[bot]"
          git config user.email "paper-track@users.noreply.github.com"
          git add paper
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "paper-track: update records [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          echo "push failed"; exit 1
